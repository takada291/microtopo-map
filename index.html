        #map { flex-grow: 1; width: 100%; }
        
        button { padding: 8px 12px; font-size: 14px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; white-space: nowrap; }

        .btn-blue:hover { background-color: #0056b3; }

        .btn-green:hover { background-color: #218838; }

        .btn-red:hover { background-color: #c82333; }
        .btn-red:disabled { background-color: #e49ca2; cursor: not-allowed; }
        
        select, input[type="text"] { padding: 6px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="text"] { width: 130px; }
        
        #loading { display: none; font-weight: bold; color: #d32f2f; font-size: 14px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

        <h3>🚨 ご利用にあたって（免責事項）</h3>
        <p>「赤色立体図」はアジア航測株式会社の登録商標であり、独自の特許技術です。</p>
        <p>本アプリで作成される<strong>「微地形図」</strong>は、特許技術（地上開度・地下開度等の計算）を使用せず、地理院APIのDEMデータに対して、隣接ピクセルの高低差（ラプラシアンフィルタと傾斜量）を利用した<strong>独自の簡易計算により描画した擬似的な画像</strong>です。</p>
        <p>出力結果は本来の赤色立体図とはアルゴリズムが異なる別物であることをご理解の上、林業業務等の参考としてご利用ください。</p>
        <div style="text-align: right; margin-top: 15px;">

        </div>

</div>

        <option value="35.472,133.050">島根県</option>
        <option value="34.661,133.935">岡山県</option>

        <option value="33.559,133.531">高知県</option>

        <option value="33.249,130.298">佐賀県</option>
        <option value="32.744,129.873">長崎県</option>
        <option value="32.789,130.741">熊本県</option>

        <option value="31.911,131.423">宮崎県</option>
        <option value="31.560,130.558">鹿児島県</option>
        <option value="26.212,127.681">沖縄県</option>
    </select>
    
    <div>
        <input type="text" id="latLonInput" placeholder="緯度, 経度">
        <button class="btn-blue" onclick="jumpToCoordinates()">移動</button>
    </div>
    
    <button class="btn-green" onclick="createReliefMap()">✨ １．枠内に微地形図を作成</button>
    <button class="btn-red" id="btnExport" onclick="exportImage()" disabled>💾 ２．林小班図用に切出</button>
    
    <span id="loading">処理中...（数秒かかります）</span>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>

<script>
    const map = L.map('map').setView([36.065, 136.221], 15);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
        attribution: '地理院タイル (淡色地図)',
        maxZoom: 18
    }).addTo(map);
    L.control.scale({ imperial: false, metric: true }).addTo(map);

    const frameLayer = L.rectangle([[0,0], [0,0]], {
        color: "#ff0000", weight: 3, fillOpacity: 0.05, interactive: false, dashArray: '5, 5'
    }).addTo(map);

    function updateFrame() {
        const center = map.getCenter();
        const latM = 2100 / 2;   
        const lngM = 1485 / 2;   
        
        const R = 6378137;
        const dLat = (lngM / R) * (180 / Math.PI);
        const dLng = (latM / (R * Math.cos(Math.PI * center.lat / 180))) * (180 / Math.PI);
        
        const bounds = L.latLngBounds(
            [center.lat - dLat, center.lng - dLng],
            [center.lat + dLat, center.lng + dLng]
        );
        frameLayer.setBounds(bounds);
    }
    map.on('move', updateFrame);
    updateFrame();

    function changePref() {
        const val = document.getElementById("prefSelect").value.split(",");
        map.setView([parseFloat(val[0]), parseFloat(val[1])], 14);
    }

    function jumpToCoordinates() {
        const inputVal = document.getElementById("latLonInput").value.replace(/,/g, ' ').trim().split(/\s+/);
        if (inputVal.length >= 2) {
            map.setView([parseFloat(inputVal[0]), parseFloat(inputVal[1])], 15);
        }
    }

    let currentOverlay = null;
    let exportDataUrl = null;
    let exportBounds = null;

    const fetchDemTile = (x, y, z) => {
        return new Promise((resolve) => {
            const types = ['dem5a_png', 'dem5b_png', 'dem5c_png'];
            let currentIdx = 0;
            
            const tryNext = () => {
                if (currentIdx >= types.length) {
                    resolve(null);
                    return;
                }
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = `https://cyberjapandata.gsi.go.jp/xyz/${types[currentIdx]}/${z}/${x}/${y}.png`;
                img.onload = () => resolve(img);
                img.onerror = () => {
                    currentIdx++;
                    tryNext();
                };
            };
            tryNext();
        });
    };

    async function createReliefMap() {
        try {
            document.getElementById('loading').style.display = 'inline';
            document.getElementById('btnExport').disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 100));

            const bounds = frameLayer.getBounds();
            exportBounds = bounds;
            const z = 15;
            
            const topLeft = map.project(bounds.getNorthWest(), z);
            const bottomRight = map.project(bounds.getSouthEast(), z);

            const minTileX = Math.floor(topLeft.x / 256);
            const minTileY = Math.floor(topLeft.y / 256);
            const maxTileX = Math.floor(bottomRight.x / 256);
            const maxTileY = Math.floor(bottomRight.y / 256);

            const tw = 256;
            const canvas = document.createElement('canvas');
            canvas.width = (maxTileX - minTileX + 1) * tw;
            canvas.height = (maxTileY - minTileY + 1) * tw;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            const promises = [];
            for (let x = minTileX; x <= maxTileX; x++) {
                for (let y = minTileY; y <= maxTileY; y++) {
                    promises.push(fetchDemTile(x, y, z).then(img => {
                        if (img) {
                            ctx.drawImage(img, (x - minTileX) * tw, (y - minTileY) * tw);
                        }
                    }));
                }
            }
            await Promise.all(promises);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const outData = ctx.createImageData(canvas.width, canvas.height);
            
            const getZ = (i) => {
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a === 0 || (r === 128 && g === 0 && b === 0) || (r === 0 && g === 0 && b === 0)) return null;
                const v = (r << 16) + (g << 8) + b;
                return (v < 8388608) ? v * 0.01 : (v - 16777216) * 0.01;
            };

            const w = canvas.width;
            for (let py = 1; py < canvas.height - 1; py++) {
                for (let px = 1; px < w - 1; px++) {
                    const idx = (py * w + px) * 4;
                    const zC = getZ(idx);
                    
                    if (zC === null) {
                        outData.data[idx] = 240; outData.data[idx+1] = 240; outData.data[idx+2] = 240; outData.data[idx+3] = 255;
                        continue;
                    }
                    
                    const zU = getZ(idx - w * 4) ?? zC;
                    const zD = getZ(idx + w * 4) ?? zC;
                    const zL = getZ(idx - 4) ?? zC;
                    const zR = getZ(idx + 4) ?? zC;
                    
                    const dx = (zR - zL) / 2.0, dy = (zD - zU) / 2.0;
                    const slope = Math.sqrt(dx * dx + dy * dy);
                    const laplacian = (zU + zD + zL + zR) / 4.0 - zC;
                    
                    let r = 255;
                    let g = 255 - Math.min(slope * 30, 255);
                    let b = g;
                    let shade = laplacian * 60;
                    
                    outData.data[idx]   = Math.max(0, Math.min(255, r - shade));
                    outData.data[idx+1] = Math.max(0, Math.min(255, g - shade));
                    outData.data[idx+2] = Math.max(0, Math.min(255, b - shade));
                    outData.data[idx+3] = 255;
                }
            }
            ctx.putImageData(outData, 0, 0);

            const pxWest = Math.round(topLeft.x - minTileX * 256);
            const pxNorth = Math.round(topLeft.y - minTileY * 256);
            const cropW = Math.round(bottomRight.x - topLeft.x);
            const cropH = Math.round(bottomRight.y - topLeft.y);
            
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            const cropCtx = cropCanvas.getContext('2d');
            
            cropCtx.fillStyle = '#ffffff';
            cropCtx.fillRect(0, 0, cropW, cropH);
            cropCtx.drawImage(canvas, pxWest, pxNorth, cropW, cropH, 0, 0, cropW, cropH);
            
            exportDataUrl = cropCanvas.toDataURL('image/jpeg', 0.95);
            
            if (currentOverlay) { map.removeLayer(currentOverlay); }
            currentOverlay = L.imageOverlay(exportDataUrl, bounds, { opacity: 0.9 }).addTo(map);
            
            document.getElementById('btnExport').disabled = false;
        } catch (error) {
            console.error("生成エラー:", error);
            alert("画像の作成に失敗しました。\n" + error.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function dataURLtoBlob(dataurl) {
        const arr = dataurl.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while(n--){
            u8arr[n] = bstr.charCodeAt(n);
        }
        return new Blob([u8arr], {type: mime});
    }

    function downloadBlob(blob, filename) {
        const blobUrl = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = filename;
        link.href = blobUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => window.URL.revokeObjectURL(blobUrl), 100);
    }

    function exportImage() {
        if (!exportDataUrl || !exportBounds) return;
        
        const s = exportBounds.getSouth().toFixed(6);
        const w = exportBounds.getWest().toFixed(6);
        const n = exportBounds.getNorth().toFixed(6);
        const e = exportBounds.getEast().toFixed(6);
        
        const coordsString = `${s},${w},${n},${e}`;
        const zeroth = {};
        zeroth[piexif.ImageIFD.ImageDescription] = coordsString;
        const exifObj = {"0th": zeroth, "Exif": {}, "GPS": {}};
        const exifBytes = piexif.dump(exifObj);
        
        const newDataUrl = piexif.insert(exifBytes, exportDataUrl);
        const filename = `microtopo-map_${s}_${w}_${n}_${e}.jpg`;
        const blob = dataURLtoBlob(newDataUrl);

        // スマートフォン・タブレットからのアクセスかを判定
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // スマホかつWeb Share APIが利用可能な場合は共有ダイアログを呼び出す
        if (isMobile && navigator.canShare && navigator.share) {
            const file = new File([blob], filename, { type: "image/jpeg" });
            if (navigator.canShare({ files: [file] })) {
                navigator.share({
                    files: [file],
                    title: '微地形図'
                }).catch((error) => {
                    console.log('共有キャンセルまたはエラー', error);
                    downloadBlob(blob, filename);
                });
                return;
            }
        }
        
        // PCからのアクセス、または共有API非対応の場合は直接ダウンロード
        downloadBlob(blob, filename);
    }
</script>
</body>
